<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3Days ワークショップ スライド v2（冒頭ブリーフィング版） — AIとつくる自分の SaaS の MVP</title>
<style>
:root{
  --bg:#d6d3ca; --paper:#fffdf8; --ink:#2d2a24; --muted:#6b6453;
  --accent:#0d9488; --accent-deep:#0f766e; --gold:#c8a96a; --line:#e7e1d3;
  --code-bg:#2d2a24; --code-ink:#f4efe4;
  --warn-bg:#fcf3e6; --warn-bd:#e3b873; --warn-ink:#6b4f22;
  --danger-bg:#fef0ec; --danger-bd:#dc6931; --danger-ink:#8a3010;
  --d1:#3a7bd5; --d1-bg:#eaf3fb; --d1-ink:#1a4a80;
  --d2:#d97706; --d2-bg:#fff3e2; --d2-ink:#7a3d00;
  --d3:#7c5cbf; --d3-bg:#f0ebf8; --d3-ink:#42207a;
  --d0:#0f766e; --d0-bg:#e6fafa; --d0-ink:#0f766e;
  font-size:18px;
}
@media(min-width:1280px){:root{font-size:20px}}
@media(min-width:1680px){:root{font-size:22px}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
  line-height:1.7; overflow:hidden;
}
h1,h2,h3,h4{font-family:"Hiragino Mincho ProN","Yu Mincho",serif; line-height:1.35; margin:0;}
code{font-family:"SFMono-Regular",Menlo,Consolas,monospace;}

/* ---- deck / slide ---- */
#deck{position:fixed; inset:0; overflow:hidden;}
.slide{position:absolute; inset:0; display:none; flex-direction:column;
  padding:3.6vh 5vw 7.5vh; overflow-y:auto; background:var(--paper);}
.slide.current{display:flex;}
.slide.day1{--dc:var(--d1);--dbg:var(--d1-bg);--dink:var(--d1-ink);}
.slide.day2{--dc:var(--d2);--dbg:var(--d2-bg);--dink:var(--d2-ink);}
.slide.day3{--dc:var(--d3);--dbg:var(--d3-bg);--dink:var(--d3-ink);}
.slide.day0{--dc:var(--d0);--dbg:var(--d0-bg);--dink:var(--d0-ink);}
.inner{width:100%; max-width:1060px; margin:auto;}

/* kicker + title (content) */
.kicker{font-size:.9em; font-weight:700; letter-spacing:.08em; color:var(--dc,var(--accent));
  text-transform:none; margin-bottom:.5em;}
.s-title{font-size:2.05em; color:var(--ink); padding-bottom:.35em; margin-bottom:.7em;
  border-bottom:3px solid var(--gold);}
.slide.day1 .s-title,.slide.day2 .s-title,.slide.day3 .s-title{border-bottom-color:var(--dc);}

/* content blocks */
.s-h{font-size:1.32em; margin:1.25em 0 .35em; color:var(--dink,var(--ink));
  padding:.28em .6em; border-left:5px solid var(--dc,var(--accent)); background:#f6f3ea; border-radius:0 6px 6px 0;}
.s-p{font-size:1.12em; margin:.65em 0;}
.s-ul{margin:.6em 0 .9em; padding-left:1.5em;}
.s-ul>li{font-size:1.02em; color:#4d473b; margin:.4em 0;}
.s-ul>li::marker{color:var(--gold);}
.s-ol{margin:.6em 0 .9em; padding-left:1.6em;}
.s-ol>li{font-size:1.1em; margin:.7em 0; padding-left:.2em;}
.s-ol>li::marker{color:var(--dc,var(--accent)); font-weight:700;}
.s-ul .s-ol,.s-ol .s-ul{margin:.4em 0;}
code{background:#efe9db; padding:.1em .4em; border-radius:5px; font-size:.9em; color:#7a4f2a;}
.s-code{background:var(--code-bg); color:var(--code-ink); padding:.85em 1.1em; border-radius:10px;
  overflow:auto; font-size:.98em; line-height:1.55; margin:.7em 0; white-space:pre-wrap; word-break:break-word;}
.s-code code{background:none; color:inherit; padding:0; font-size:1em;}
.s-key{margin:.8em 0; padding:.85em 1.15em; background:var(--warn-bg);
  border-left:6px solid var(--warn-bd); border-radius:0 8px 8px 0; font-size:1.05em; color:var(--warn-ink);}
.s-warn{margin:.8em 0; padding:.8em 1.15em; background:var(--danger-bg);
  border-left:6px solid var(--danger-bd); border-radius:0 8px 8px 0; font-size:1.02em; color:var(--danger-ink);}
.sbody a{color:var(--accent); text-underline-offset:2px;}
.s-note{margin:.7em 0; padding:.65em 1.05em; background:#f5f2ea; border-left:4px solid var(--line);
  border-radius:0 6px 6px 0; font-size:.98em; color:var(--muted);}
.s-done{margin:1em 0 .3em; padding:.5em .9em; background:var(--d0-bg); border-left:6px solid var(--accent);
  border-radius:0 8px 8px 0; color:var(--accent-deep); font-size:1.2em; font-family:"Hiragino Mincho ProN","Yu Mincho",serif;}
.s-donelist{margin:.3em 0 .9em; padding-left:1.5em;}
.s-donelist>li{font-size:1.05em; margin:.4em 0;}
.s-donelist>li::marker{color:var(--accent);}
.s-fig{margin:.9em 0; text-align:center;}
.s-fig img{max-width:100%; max-height:min(46vh,24em); border:1px solid var(--line); border-radius:10px; background:#fff; cursor:zoom-in;}
.s-figrow{display:flex; gap:1.2em; margin:.9em 0; align-items:flex-start; justify-content:center;}
.s-figrow .s-fig{flex:1; min-width:0; margin:0;}
.s-figrow .s-fig img{max-height:min(36vh,16em);}
.s-fig figcaption{font-size:.9em; color:var(--muted); margin-top:.4em;}
.s-tablewrap{overflow-x:auto; margin:.8em 0;}
table.s-table{border-collapse:collapse; width:100%; font-size:1em; background:#fff;
  border:1px solid var(--line); border-radius:10px; overflow:hidden;}
.s-table th,.s-table td{padding:.5em .7em; border:1px solid var(--line); text-align:left; vertical-align:top;}
.s-table thead th{background:var(--dc,var(--accent)); color:#fff;}
.s-table tbody tr:nth-child(even){background:#faf7ef;}
strong{font-weight:700; color:inherit;}

/* ---- cover ---- */
.slide.cover{background:radial-gradient(120% 120% at 20% 0%, #fffdf8 0%, #f0ece0 60%, #e4dfd1 100%);}
.cover .inner{text-align:left;}
.cover .badge{display:inline-block; font-size:.95em; font-weight:700; letter-spacing:.14em;
  color:var(--accent-deep); background:#e6fafa; border:1px solid #bfe6e2; padding:.35em .9em; border-radius:999px; margin-bottom:1.1em;}
.cover h1{font-size:3.1em; line-height:1.25; color:var(--ink); margin-bottom:.5em;}
.cover .csub{font-size:1.35em; color:var(--muted); margin:.2em 0 1.4em;}
.cover .cmeta{font-size:1em; color:var(--muted); border-top:1px dashed var(--line); padding-top:1em;}
.cover .cmeta b{color:var(--accent-deep);}

/* ---- divider ---- */
.slide.divider{color:#fff;
  background:linear-gradient(135deg, var(--dc,var(--accent)) 0%, color-mix(in srgb, var(--dc,var(--accent)) 78%, #000) 100%);}
.divider .dlabel{font-size:1.3em; font-weight:700; letter-spacing:.2em; opacity:.9; margin-bottom:.4em;}
.divider .dkicker{font-size:1.6em; opacity:.92; margin-bottom:.2em; font-family:"Hiragino Mincho ProN",serif;}
.divider h1{font-size:3.4em; line-height:1.2; margin:.1em 0 .4em;}
.divider .dsub{font-size:1.35em; opacity:.95; max-width:24em; line-height:1.6;}
.divider .drule{width:88px; height:5px; background:rgba(255,255,255,.85); border-radius:3px; margin:1.1em 0;}

/* ---- break（作業タイム） ---- */
.slide.break{background:linear-gradient(140deg, var(--dbg,#e6fafa) 0%, #fffdf8 55%, var(--dbg,#e6fafa) 100%);}
.break .inner{max-width:960px;}
.break .bhead{display:flex; align-items:center; gap:.6em; margin-bottom:.4em;}
.break .bicon{font-size:1.9em; line-height:1;}
.break .btag{font-size:1.15em; font-weight:800; letter-spacing:.14em; color:var(--dc);}
.break .bstep{margin-left:auto; font-size:1em; font-weight:800; color:#fff; background:var(--dc);
  padding:.28em .8em; border-radius:999px; letter-spacing:.05em;}
.break .bsec{font-size:1em; color:var(--muted); font-weight:600; margin-bottom:.15em;}
.break h1{font-size:1.8em; color:var(--ink); line-height:1.35; margin-bottom:.6em;}
.break .card{background:#fff; border:1px solid var(--line); border-radius:16px;
  box-shadow:0 10px 40px rgba(60,50,30,.10); padding:1em 1.3em;}
.break .todo{list-style:none; margin:0; padding:0;}
.break .todo li{display:flex; align-items:flex-start; gap:.7em; font-size:1.05em;
  padding:.42em 0; border-bottom:1px dashed var(--line); cursor:pointer;}
.break .todo li:last-child{border-bottom:none;}
.break .todo .chk{flex:0 0 auto; width:1.35em; height:1.35em; margin-top:.08em; border-radius:6px;
  border:2px solid var(--dc); display:inline-flex; align-items:center; justify-content:center;
  font-size:.95em; color:#fff; transition:background .15s;}
.break .todo li.done .chk{background:var(--dc);}
.break .todo li.done .chk::after{content:"✓";}
.break .todo li.done .txt{color:var(--muted); text-decoration:line-through;}
.break .bcode{background:var(--code-bg); color:var(--code-ink); padding:.7em 1em; border-radius:10px;
  margin-top:.8em; font-size:.9em; line-height:1.5; white-space:pre-wrap; word-break:break-word;}
.break .bcode code{background:none; color:inherit; font-size:1em;}
.break .bwarn{margin-top:.8em; padding:.6em 1em; background:var(--danger-bg);
  border-left:5px solid var(--danger-bd); border-radius:0 8px 8px 0; font-size:.92em; color:var(--danger-ink);}
.break .bdone{margin-top:.9em; font-size:1em; color:var(--accent-deep); font-weight:700;}
.break .bdone b{color:var(--accent-deep);}
.break .bnext{margin-top:.9em; text-align:center; font-size:1em; color:var(--dc); font-weight:700;}

/* ---- 縦に収まらないときの自動調整（JS が .cols2 / font-size を付与） ---- */
.sbody>*{break-inside:avoid;}
.s-ol .s-ul>li{font-size:.93em;}
.slide.content .inner.cols2{max-width:1240px;}
.slide.content .inner.cols2 .sbody{columns:2; column-gap:2.2em;}
.slide.break .inner.cols2{display:grid; grid-template-columns:1fr 1.15fr; gap:1em 2em; align-items:center; max-width:1200px;}
.slide.break .inner.cols2 .bhero h1{margin-bottom:0;}
.slide.break .inner.cols2 .bnext{grid-column:1/-1; margin-top:.2em;}
/* 画像クリックで拡大表示 */
#lightbox{display:none; position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:2000;
  cursor:zoom-out; align-items:center; justify-content:center; padding:16px;}
#lightbox.show{display:flex;}
#lightbox img{max-width:94vw; max-height:94vh; border-radius:10px;
  box-shadow:0 8px 60px rgba(0,0,0,.6); object-fit:contain; background:#fff;}

/* ---- chrome ---- */
#bar{position:fixed; top:0; left:0; height:5px; background:var(--accent); z-index:50; transition:width .2s;}
#hud{position:fixed; bottom:0; left:0; right:0; height:5.5vh; min-height:34px; z-index:40;
  display:flex; align-items:center; gap:12px; padding:0 16px; font-size:.85rem; color:var(--muted);
  background:linear-gradient(0deg, rgba(255,253,248,.92), rgba(255,253,248,0));}
#hud .hlabel{font-weight:700;}
/* 対応する flow.html の章へのリンク（該当章が無いスライドでは非表示） */
#hud .hflow{color:var(--muted); text-decoration:none; border:1px solid var(--line); border-radius:7px;
  padding:.15em .6em; font-size:.9em; white-space:nowrap;}
#hud .hflow:hover{background:#efe9db; color:var(--ink);}
#hud .hflow.hide{visibility:hidden;}
#hud .hspace{flex:1;}
#hud button{background:none; border:1px solid var(--line); color:var(--muted); border-radius:7px;
  width:30px; height:30px; cursor:pointer; font-size:1rem; line-height:1;}
#hud button:hover{background:#efe9db; color:var(--ink);}
#hud .hcount{font-variant-numeric:tabular-nums; min-width:64px; text-align:right;}
.slide.divider ~ #hud, .slide.break ~ #hud{}

/* overview grid */
#grid{position:fixed; inset:0; background:rgba(30,26,20,.92); z-index:100; display:none;
  overflow-y:auto; padding:3vh 3vw;}
#grid.show{display:block;}
#grid h2{color:#fffdf8; font-size:1.2rem; margin-bottom:1em;}
#grid .gwrap{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px;}
#grid .gcard{background:#fffdf8; border-radius:10px; padding:.7em .8em; cursor:pointer; border:2px solid transparent;
  min-height:74px; display:flex; flex-direction:column; gap:.25em;}
#grid .gcard:hover{border-color:var(--accent);}
#grid .gcard.cur{border-color:var(--gold);}
#grid .gnum{font-size:.72rem; color:var(--muted); font-weight:700;}
#grid .gtype{font-size:.66rem; font-weight:700; letter-spacing:.06em; padding:.05em .4em; border-radius:4px; align-self:flex-start;}
#grid .gtype.break{background:#fde8dc;color:#8a3010;}
#grid .gtype.content{background:#e6fafa;color:#0f766e;}
#grid .gtype.divider{background:#e9e3f6;color:#42207a;}
#grid .gtype.cover{background:#f3ecd6;color:#7a5a1a;}
#grid .gttl{font-size:.82rem; color:var(--ink); line-height:1.3;}
#help{position:fixed; bottom:6vh; right:16px; z-index:41; font-size:.78rem; color:var(--muted);
  background:rgba(255,253,248,.9); border:1px solid var(--line); border-radius:8px; padding:.4em .7em; opacity:.85;}
@media(max-width:820px){ #help{display:none;} .cover h1{font-size:2.2em;} .divider h1{font-size:2.3em;} .s-title{font-size:1.6em;} }
</style></head>
<body>
<div id="bar"></div>
<div id="deck"></div>
<div id="hud">
  <span class="hlabel" id="hlabel"></span>
  <!-- target は名前付き（毎回新タブを増やさず同じタブを開き直す）。rel=noopener は名前を無効化するため付けない -->
  <a class="hflow" id="hflow" target="flowdoc" title="このスライドに対応する資料本編を開く">📄 詳細</a>
  <span class="hspace"></span>
  <button id="pv" title="前へ (←)">‹</button>
  <button id="nx" title="次へ (→)">›</button>
  <button id="ov" title="一覧 (o)">▦</button>
  <span class="hcount" id="hcount"></span>
</div>
<div id="help">← → / Space 移動 ・ o 一覧 ・ f 全画面 ・ 画像クリックで拡大</div>
<div id="grid"><h2>スライド一覧（クリックで移動 / Esc で閉じる）</h2><div class="gwrap" id="gwrap"></div></div>
<div id="lightbox"><img alt=""></div>

<script>
const SLIDES = [
  { type:'cover', badge:'3Days ワークショップ', title:'AI とつくる<br>「自分の SaaS の MVP」', sub:'Claude Design → Claude Code で、LP＋購入＋マイページを一周する3日間', meta:'<b>Day 1</b> つくる　・　<b>Day 2</b> つなぐ・公開する　・　<b>Day 3</b> 育てる（オプション＋発表会）' },

  { type:'divider', ref:'s0', day:0, label:'OVERVIEW', title:'目的・ゴールと全体像', sub:'この3日間で何を・どう作るか' },
  { type:'content', day:0, sec:'はじめに', title:'ワークショップの目的', body:[
    {h:'前提知識'},
    {ul:['<strong>Claude Code を使ったことがある</strong>（起動・依頼・承認/拒否の基本）','<strong>Git を用いた開発経験</strong>（ブランチ・commit・push）','<strong>ソフトウェア開発の基本知識</strong>（基本情報技術者程度）']},
    {h:'目的'},
    {ul:['<strong>Claude（Design / Code）での開発フローを3日で一周する</strong> — 「AI にどう頼むと良いものが出るか」の肌感をつかむ','デザイン→フロント→バック→テスト→デプロイ→拡張 の<strong>実務に近いサイクル</strong>を AI 駆動で体験']},
  ]},
  { type:'content', day:0, sec:'はじめに', title:'題材：作りたい SaaS の MVP', body:[
    {ul:['題材は各自持ち寄り。自由だが<strong>サブスクリプション（月額/年額課金）を必須</strong>とする','3日で一周できるよう <strong>MVP</strong>（必要最小限）に絞る','資料の例「玄米茶」は説明用の共通サンプル。<strong>自分の題材に読み替える</strong>']},
    {imgrow:[{img:'img/sample_lp.png',cap:'/（LP）'},{img:'img/sample_price.png',cap:'価格'},{img:'img/sample_contact.png',cap:'/contact'},{img:'img/sample_mypage.png',cap:'/mypage'},{img:'img/sample_success.png',cap:'/success'}]},
    {note:'完成形デモ（玄米茶）: https://genmaicha-back-demo.y-arai-a8a.workers.dev/ — LP＋購入＋マイページの SaaS を「自分の題材で」作る'},
  ]},
  { type:'content', day:0, sec:'はじめに', title:'必須機能（Day 2 までの最低ライン）', body:[
    {p:'<strong>ライセンスキーの配布は全員共通の実装要件</strong>（呼び名と意味づけだけ自分のサービスに合わせる）。'},
    {table:{head:['#','機能','Day 2 までの完成ライン'],rows:[
      ['1','LP','サービス紹介と料金を掲載し、公開 URL で表示できる'],
      ['2','価格表示','料金プラン（月額/年額）を見せ、CTA から購入フロー（メール入力）へ'],
      ['3','お問い合わせ','入力→送信→受付（<code>POST /api/contact</code>）が通る'],
      ['4','マイページ','メール入力の簡易ログインで購入情報・ライセンスを表示'],
      ['5','ライセンス配布','メール入力のみ→キー発行→完了画面で表示（決済なし簡易版）'],
    ]}},
    {note:'5 の「Stripe 購入→Webhook で自動発行」への差し替えは Day 3 オプション [8]。'},
  ]},
  { type:'content', ref:'s-map', day:0, sec:'はじめに', title:'全体マップ', body:[
    {img:'img/workshop_flow_diagram.svg'},
    {table:{head:['Day','テーマ','内容'],rows:[
      ['Day 1','つくる','目的・技術紹介 / 環境確認 / [1] デザイン / [2] フロント / [3] フロントデプロイ'],
      ['Day 2','つなぐ・公開する','[4] バック / [5] 自動テスト / [6] 再デプロイ（同じ URL に API 統合）'],
      ['Day 3','育てる','オプション課題 [7]〜[13] / ラップアップ・発表会'],
    ]}},
    {key:'<strong>必達は [1]〜[6]（Day 1〜2・全員）</strong>。Day 3 の [7]〜[13] は任意（やらない／1つだけ、も可）。'},
  ]},
  { type:'content', day:0, sec:'はじめに', title:'ゴール（完了条件）①: Day 1〜2（必達）', body:[
    {table:{head:['#','タスク','Day','完了条件'],rows:[
      ['[1]','デザイン','1','LP の配色・トーン・構成が決まり zip 書き出しできる'],
      ['[2]','フロント','1','dev URL で崩れず表示／React Router で4ページ遷移'],
      ['[3]','フロントデプロイ','1','workers.dev で LP 表示・URL 共有できる'],
      ['[4]','バック','2','フロントと API がつながる／/api/me 未認証で弾く・/api/contact 不正入力で弾く'],
      ['[5]','自動テスト','2','バック・フロントそれぞれで npm test グリーン。純粋関数・正常系・異常系・未認証 各1本＋画面テスト1本'],
      ['[6]','デプロイ','2','自分の workers.dev で LP 表示・/mypage が404にならない'],
    ]}},
    {note:'ここまでが<strong>全員必達</strong>（Day 1〜2）。'},
  ]},
  { type:'content', day:0, sec:'はじめに', title:'ゴール（完了条件）②: Day 3（オプション）', body:[
    {table:{head:['#','タスク','難易度','完了条件'],rows:[
      ['[7]','メール(Resend)','★☆☆','メールを実装し自分宛に届く'],
      ['[8]','決済(Stripe)','★★★','Checkout→Webhook でキー自動発行・マイページに表示'],
      ['[9]','ID連携(Clerk)','★★☆','未ログインで /mypage 不可・/api/me がログイン必須'],
      ['[10]','運用保守','★☆☆','wrangler tail でログ確認・運用スキルが1つ動く'],
      ['[11]','セキュリティ','★★★','認証境界・IDOR・機密マスクを点検し最低1つ修正'],
      ['[12]','テスト設計','★★★','主要機能を1つ選び仕様化→期待動作表→テスト設計'],
      ['[13]','自動デプロイ(Workers Builds)','★★☆','git push だけで自動デプロイされる設定を完了し、push で新しいビルドが自動で現れる'],
    ]}},
    {note:'Day 3 は<strong>任意</strong>（やらない／1つだけ、も可）。'},

  { type:'content', day:0, sec:'認証切り替え', title:'これだけ覚える', body:[
    {key:'どのキーを使うかは <code>~/.claude.json</code> の記録で決まる。<strong><code>rejected</code> のキーは無視されサブスクが使われ、<code>approved</code> のキーは使われる</strong>（サブスクより優先）。切り替え＝この記録を <code>/config</code> や起動時プロンプトで切り替えること。'},
    {table:{head:['状態','意味','起動時の挙動'],rows:[
      ['approved','使うと承認済み','この API キーで動く（サブスクより優先）'],
      ['rejected','使わないと拒否済み','キーを無視してサブスクで動く'],
      ['new','未選択','「このキーを使う?」と確認が出る'],
    ]}},
  ]},
  { type:'content', ref:'auth-to-sub', day:0, sec:'認証切り替え', title:'① API → サブスク（一時的に切り替え）', body:[
    {ol:['<code>/logout</code>（approved が空になる）','<code>claude</code> 再起動 → 「このAPIキーを使う?」に <strong>「2. No (recommended)」</strong>','自動表示されるログイン選択で <strong>「1. Claude account with subscription」</strong> → claude.ai でログイン','<code>/status</code> で <code>claude.ai</code> になっていれば成功']},
    {note:'env の API キーは消さなくてよい（/logout が承認を外すのでサブスクが使われる）。確認プロンプトが煩わしければ <code>unset ANTHROPIC_API_KEY</code>。'},
  ]},
  { type:'content', ref:'auth-to-api', day:0, sec:'認証切り替え', title:'② サブスク → API（普段の運用に戻す）', body:[
    {ol:['env に API キーがあることを確認（<code>export ANTHROPIC_API_KEY="sk-ant-..."</code>）','<code>claude</code> 起動','<code>/config</code> で「Use custom API key」を <strong>ON</strong>（rejected から外れ approved に）','<code>/status</code> で API キー利用になっていれば成功']},
    {note:'ゴールはキーを rejected から外すこと。手動なら ~/.claude.json の rejected から末尾20文字のエントリを削除（new に戻る）。'},

  { type:'content', day:1, sec:'Day 1 セキュリティ対策', title:'Claude Code のセキュリティ対策（最初に1回）', body:[
    {key:'大前提（3日間ずっと効く）: <strong>秘密情報（API キー・トークン）は Claude への指示にも会話にも貼らない</strong>。<code>.dev.vars</code> に入れて参照させる。AI が書いたコードも<strong>読まずに承認しない</strong>。'},
    {p:'このあと3つの設定を置く：① 秘密を読ませない deny 設定　② security-guidance プラグイン　③ npm 取り込み制限。'},
  ]},
  { type:'content', day:1, sec:'Day 1 セキュリティ対策', title:'① 秘密を Claude に読ませない（deny 設定）', body:[
    {note:'よくある勘違い: .claudeignore は無い。正しくは <code>.claude/settings.json</code> の <code>permissions.deny</code> で読み取り禁止を宣言する。'},
    {code:`{
  "permissions": {
    "deny": [
      "Read(./.dev.vars)",
      "Read(./**/.dev.vars)",
      "Read(./.env)",
      "Read(./.env.*)",
      "Read(./secrets/**)"
    ]
  }
}`},
    {ul:['<code>deny</code> は最優先。頼んでも <strong>Claude は読めない＝事故防止</strong>','秘密ファイルが登場するのは [4] から。<strong>設定だけ先に置く</strong>のがコツ']},
    {img:'img/permissionDenied.png',cap:'deny の発動例: .dev.vars を「読んで」と頼んでも Claude が拒否する'},
  ]},
  { type:'content', day:1, sec:'Day 1 セキュリティ対策', title:'② security-guidance プラグイン', body:[
    {p:'生成コードを<strong>バックグラウンドで自動セキュリティレビュー</strong>してくれるプラグイン。SQLi・XSS・SSRF・IDOR・認可バイパスなど<strong>25種以上</strong>を継続チェック。'},
    {ol:['<code>/plugin</code> → Discover タブで「secu」検索 → <strong>security-guidance</strong> を選ぶ','インストール範囲（scope）を選ぶ（例 project scope）','<code>/reload-plugins</code> で有効化 → <code>/plugin list</code> で確認']},
    {imgrow:[{img:'img/security-guidance1.png',cap:'① Discover で「secu」検索 → 選ぶ'},{img:'img/security-guidance2.png',cap:'② インストール範囲（scope）を選ぶ'}]},
    {note:'前提: python3 が PATH に。見つからない/無ければスキップ可（本編に影響なし）。うるさければ <code>/plugin disable security-guidance</code>。'},
  ]},
  { type:'content', day:1, sec:'Day 1 セキュリティ対策', title:'③ npm パッケージの取り込み制限（.npmrc）', body:[
    {p:'公開直後のパッケージは乗っ取りリスク。プロジェクト直下に <code>.npmrc</code> を置く:'},

audit=true`},

  ]},

  { type:'content', day:3, sec:'[12] テスト設計', title:'[12] お題と一番の罠', body:[
    {p:'<strong>お題:</strong>「間違うと一番痛い」機能を1つ選び、正しい振る舞いを<strong>自分で仕様化</strong>して、要るテストを<strong>自分で決めて</strong>実装する。'},

  { type:'content', day:3, sec:'[12] テスト設計', title:'[12] 流れ ①②③（仕様 → 表）', body:[
    {ol:['<strong>（5分）対象を1機能に絞り名前をつける</strong>（例「マイページのライセンス表示」）。全機能はやらない','<strong>（15分）あるべき動作を自分の言葉で書く</strong>（3問: 誰の何のため／使い終わって何が真であるべき／絶対起きてはいけないこと）','<strong>あるべき動作を AI に期待動作表へ展開させ docs/TEST.md へ</strong>']},
    {code:`次は私が書いた「<機能名> のあるべき動作」です:
（↑で書いた3〜5行を貼る）

これを期待動作表に展開して docs/TEST.md に追記して。
表は「入力・状態 | 期待結果 | 書く」の3列。
入力の同値クラス（正常・不正・境界・空・重複）と状態・遷移で行を増やして。
ただし「期待結果」と「書く」は空欄のまま——そこは私が埋める。
実装コードは読まず、上の仕様だけを根拠にすること。`},
    {warn:'⚠️ ここを AI に丸投げしない。頼むなら「backend のコードは読まず SCREEN_SPEC.md と私の説明だけを根拠に」と縛る。'},
  ]},

    {p:'<strong>お題:</strong> <code>git push</code> するだけで Cloudflare へ自動的にビルド・デプロイされる状態にする（[6] の手動デプロイを卒業）。'},

    {key:'他の Day 3 課題と違い、<strong>作業はすべて Cloudflare ダッシュボード側の設定で完結</strong>。コードの変更も Claude Code への依頼も無い。一度設定すれば、あとは普段どおり push するだけ。'},

  { type:'content', day:3, sec:'[13] 自動デプロイ', title:'[13] 連携手順（4つの設定）', body:[
    {ol:['Cloudflare ダッシュボード: <strong>Account home → 対象の Worker → Settings → Build</strong> の GitHub ボタン','GitHub 側の <strong>Install &amp; Authorize</strong> で <strong>Only select repositories</strong> を選び対象のみ許可','<strong>Connect to a repository</strong> 画面で4つを設定: <strong>Git account</strong>（自分のアカウント）／<strong>Path（Root directory）を <code>backend</code></strong>／<strong>Build command に <code>npm install --prefix ../frontend &amp;&amp; npm run build:front</code></strong>／<strong>Production branch を <code>main</code></strong>']},
    {warn:'⚠️ ここでも「All repositories」は選ばない（プライベートリポジトリすべてに Cloudflare がアクセスできてしまう）。'},
    {imgrow:[{img:'img/CloudflareWorkerBuildSection.png',cap:'Settings → Build セクションの GitHub ボタン'},{img:'img/CloudflareConnectRepoSettings.png',cap:'Connect to a repository — 4つの設定'}]},
    {note:'Production branch が main のため、dev への push はプレビューのみ・<strong>dev→main マージがそのまま本番公開</strong>になる（Git ブランチ運用の注意参照）。'},
  ]},

    {table:{head:['リソース','残す','片付ける'],rows:[
      ['Worker / D1','公開したままで可（無料枠内）','ダッシュボードで削除'],
      ['CF API トークン','[10] を続けるなら残す','Revoke＋.cf-ops.token 削除'],
      ['Stripe(テスト)','放置で害なし','Webhook 削除'],
      ['Clerk','残すならそのまま','アプリ削除＋frontend/.env の鍵削除'],
      ['Resend キー','使い続けるなら残す','キーを Revoke'],
      ['SonarCloud/App','継続解析なら残す','プロジェクト削除＋App 権限解除'],
      ['Workers Builds（[13]）','自動デプロイを続けるなら残す','Worker → Settings → Build で Disconnect。GitHub 側は<strong>2箇所</strong>: Installed Apps の <strong>Uninstall</strong> ＋ Authorized Apps の <strong>Revoke</strong>（片方だけでは不十分）'],
    ]}},
    {note:'原則: 鍵は「消す」より先に「無効化（Revoke）」（消しても発行済みの鍵は生きている）。GitHub の App 解除はアカウント側 Settings → Applications から（リポジトリ側の Settings ではない）。'},
  ]},

  { type:'cover', badge:'FIN', title:'おつかれさまでした 🍵', sub:'自分の URL で公開された、自分の SaaS を持ち帰ろう', meta:'資料本編: <b>flow.html</b>　／　このスライド: <b>slides-v2.html</b>' },

];

/* ---------- flow.html との共通キー（章キー） ----------
   flow.html の見出し id をそのまま章キーとして使う。番号ではなく意味のIDで結ぶので、
   スライドを増減してもリンクが腐らない。
   基本は sec から下表で引き、それで決まらないスライドだけ ref:'...' を直接持たせている。 */
const SEC2REF = {
  'はじめに'                        : 's0',
  '認証切り替え'                    : 'auth',
  'Day 1'                           : 's-env',
  'Day 1 セキュリティ対策'          : 's06',
  'Day 1（[1] 着手前）'             : 's0-nav',
  'Day 1（[2] 着手前）'             : 's0-repo',
  '[1] Claude Design'               : 's1',
  'S-1（[1] の生成待ち時間に並行）' : 's2-spec',
  'S-1（[2] 着手前）'               : 's2-spec',
  '[2] フロント作成'                : 's2',
  '[3] フロントデプロイ'            : 's3',
  'Day 1 クロージング'              : 's3',
  '[4] バック作成'                  : 's4',
  '[5] 自動テスト'                  : 's5',
  '[6] デプロイ'                    : 's6',
  'Day 3'                           : 'day3',
  '[7][8][9] 共通'                  : 'common',
  '[7] メール(Resend)'              : 's7',
  '[8] 決済(Stripe)'                : 's8',
  '[9] ID連携(Clerk)'               : 's9',
  '[10] 運用保守'                   : 's10',
  '[11] セキュリティ'               : 's11',
  '[12] テスト設計'                 : 's12',
  '[13] 自動デプロイ'               : 's13',
  'ラップアップ'                    : 'wrap',
  '後片付け'                        : 'cleanup',
};
function refFor(s){ return s.ref || (s.sec && SEC2REF[s.sec]) || null; }
// 章キー → そのキーを持つ最初のスライド番号（slides.html#s4 でのジャンプ用）
const REF_FIRST = {};
SLIDES.forEach((s,i)=>{ const r=refFor(s); if(r && REF_FIRST[r]===undefined) REF_FIRST[r]=i; });

/* ---------- render helpers ---------- */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function block(b){
  if(b.h!=null) return `<h3 class="s-h">${b.h}</h3>`;
  if(b.p!=null) return `<p class="s-p">${b.p}</p>`;
  if(b.ul!=null) return `<ul class="s-ul">${b.ul.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  if(b.ol!=null) return `<ol class="s-ol">${b.ol.map(x=>`<li>${x}</li>`).join('')}</ol>`;
  if(b.code!=null) return `<pre class="s-code"><code>${esc(b.code)}</code></pre>`;
  if(b.key!=null) return `<div class="s-key">${b.key}</div>`;
  if(b.warn!=null) return `<div class="s-warn">${b.warn}</div>`;
  if(b.note!=null) return `<div class="s-note">${b.note}</div>`;
  if(b.done!=null) return `<div class="s-done">✅ 完了の定義</div><ul class="s-donelist">${b.done.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  if(b.img!=null) return `<figure class="s-fig"><img src="${b.img}" alt="">${b.cap?`<figcaption>${b.cap}</figcaption>`:''}</figure>`;
  if(b.imgrow!=null) return `<div class="s-figrow">${b.imgrow.map(f=>`<figure class="s-fig"><img src="${f.img}" alt="">${f.cap?`<figcaption>${f.cap}</figcaption>`:''}</figure>`).join('')}</div>`;
  if(b.table!=null){
    const t=b.table;
    return `<div class="s-tablewrap"><table class="s-table"><thead><tr>${t.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead>`+
      `<tbody>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  return '';
}
function dayClass(s){ return 'day'+(s.day!=null?s.day:0); }

function renderSlide(s){
  if(s.type==='cover'){
    return `<div class="inner">
      <span class="badge">${s.badge||'3Days ワークショップ'}</span>
      <h1>${s.title}</h1>
      ${s.sub?`<p class="csub">${s.sub}</p>`:''}
      ${s.meta?`<div class="cmeta">${s.meta}</div>`:''}
    </div>`;
  }
  if(s.type==='divider'){
    return `<div class="inner">
      ${s.label?`<div class="dlabel">${s.label}</div>`:''}
      ${s.kicker?`<div class="dkicker">${s.kicker}</div>`:''}
      <h1>${s.title}</h1>
      <div class="drule"></div>
      ${s.sub?`<div class="dsub">${s.sub}</div>`:''}
    </div>`;
  }
  if(s.type==='break'){
    return `<div class="inner">
      <div class="bhero">
      <div class="bhead"><span class="bicon">✋</span><span class="btag">作業タイム</span>
        <span class="bstep">${s.step}</span></div>
      ${s.sec?`<div class="bsec">${s.sec}</div>`:''}
      <h1>${s.title}</h1>
      </div>
      <div class="card">
        <ul class="todo">${(s.todo||[]).map(t=>`<li><span class="chk"></span><span class="txt">${t}</span></li>`).join('')}</ul>
        ${s.code?`<pre class="bcode"><code>${esc(s.code)}</code></pre>`:''}
        ${s.warn?`<div class="bwarn">${s.warn}</div>`:''}
        ${s.done?`<div class="bdone">✅ ${s.done}</div>`:''}
      </div>
      <div class="bnext">できたら次へ　→</div>
    </div>`;
  }
  // content
  return `<div class="inner">
    ${s.sec?`<div class="kicker">${s.sec}</div>`:''}
    <h2 class="s-title">${s.title}</h2>
    <div class="sbody">${(s.body||[]).map(block).join('')}</div>
  </div>`;
}

/* ---------- deck engine ---------- */
const deck=document.getElementById('deck');
let els=[];
SLIDES.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide '+s.type+' '+dayClass(s);
  d.innerHTML=renderSlide(s);
  deck.appendChild(d);
  els.push(d);
});
// clickable checklist on break slides
const lightbox=document.getElementById('lightbox'), lbImg=lightbox.querySelector('img');
lightbox.addEventListener('click',()=>lightbox.classList.remove('show'));
deck.addEventListener('click',e=>{
  const li=e.target.closest('.break .todo li');
  if(li){ li.classList.toggle('done'); return; }
  const im=e.target.closest('.s-fig img');
  if(im){ lbImg.src=im.getAttribute('src'); lightbox.classList.add('show'); }
});
// 画像は遅れて高さが決まるので、読み込み完了時に表示中スライドを再フィット
deck.querySelectorAll('img').forEach(im=>im.addEventListener('load',()=>{
  if(els[cur]&&els[cur].contains(im)) fitSlide(els[cur],SLIDES[cur]);
}));

// マウスホイールでスライド送り。
// スクロール余地のあるスライドは端まで見てから送る／慣性で連続送りしないようクールダウン
let wheelAcc=0, wheelLock=0, wheelLast=0;
window.addEventListener('wheel',e=>{
  if(grid.classList.contains('show')||lightbox.classList.contains('show')) return;
  const el=els[cur];
  if(el.scrollHeight>el.clientHeight+1){
    const atTop=el.scrollTop<=0;
    const atBottom=el.scrollTop+el.clientHeight>=el.scrollHeight-1;
    if((e.deltaY>0&&!atBottom)||(e.deltaY<0&&!atTop)) return; // スライド内スクロールに任せる
  }
  e.preventDefault();
  const now=Date.now();
  if(now<wheelLock) return;
  if(now-wheelLast>300) wheelAcc=0; // 間が空いたら新しいジェスチャとして数え直す
  wheelLast=now;
  wheelAcc+=e.deltaY*(e.deltaMode===1?33:e.deltaMode===2?300:1);
  if(Math.abs(wheelAcc)>=15){
    wheelLock=now+500;
    wheelAcc>0?next():prev();
    wheelAcc=0;
  }
},{passive:false});

let cur=0;
const bar=document.getElementById('bar');
const hlabel=document.getElementById('hlabel');
const hcount=document.getElementById('hcount');
const hflow=document.getElementById('hflow');
function labelFor(s){
  if(s.type==='cover') return 'はじめに';
  if(s.type==='divider') return (s.label||'')+(s.kicker?' '+s.kicker:'');
  return s.sec||'';
}
// 縦に収まらないとき: ①2カラム化 → ②文字を段階縮小（最後の保険はスクロール）
function fitSlide(el,s){
  const inner=el.querySelector('.inner');
  if(!inner) return;
  inner.classList.remove('cols2'); inner.style.fontSize='';
  const fits=()=>el.scrollHeight<=el.clientHeight+1;
  if(fits()) return;
  if(s.type==='content'||s.type==='break'){ inner.classList.add('cols2'); if(fits()) return; }
  for(let z=95;z>=60;z-=5){ inner.style.fontSize=z+'%'; if(fits()) return; }
}
window.addEventListener('resize',()=>fitSlide(els[cur],SLIDES[cur]));

function show(i,push){
  i=Math.max(0,Math.min(SLIDES.length-1,i));
  els[cur].classList.remove('current');
  cur=i;
  els[cur].classList.add('current');
  els[cur].scrollTop=0;
  fitSlide(els[cur],SLIDES[cur]);
  bar.style.width=((i+1)/SLIDES.length*100)+'%';
  const s=SLIDES[i];
  bar.style.background='var(--d'+(s.day!=null?s.day:0)+', var(--accent))';
  hlabel.textContent=labelFor(s);
  hlabel.style.color='var(--d'+(s.day!=null?s.day:0)+'-ink, var(--muted))';
  hcount.textContent=(i+1)+' / '+SLIDES.length;
  const ref=refFor(s);
  hflow.classList.toggle('hide',!ref);
  if(ref) hflow.href='flow.html#'+ref;
  if(push!==false) history.replaceState(null,'','#'+(i+1));
  updateGridCur();
}
function next(){ show(cur+1); }
function prev(){ show(cur-1); }

/* overview grid */
const grid=document.getElementById('grid'), gwrap=document.getElementById('gwrap');
SLIDES.forEach((s,i)=>{
  const c=document.createElement('div');
  c.className='gcard'; c.dataset.i=i;
  const ttl = s.title || (s.type==='cover'?'表紙':'');
  const badge = s.type==='break'?('作業 '+s.step): (s.sec||s.label||s.type);
  c.innerHTML=`<span class="gnum">#${i+1}</span><span class="gtype ${s.type}">${s.type==='break'?'BREAK':s.type.toUpperCase()}</span><span class="gttl">${badge?`<b>${esc(badge)}</b><br>`:''}${esc(ttl)}</span>`;
  c.addEventListener('click',()=>{ show(i); closeGrid(); });
  gwrap.appendChild(c);
});
function updateGridCur(){ [...gwrap.children].forEach((c,i)=>c.classList.toggle('cur',i===cur)); }
function openGrid(){ grid.classList.add('show'); const cc=gwrap.children[cur]; if(cc) cc.scrollIntoView({block:'center'}); }
function closeGrid(){ grid.classList.remove('show'); }
function toggleGrid(){ grid.classList.contains('show')?closeGrid():openGrid(); }

document.getElementById('nx').onclick=next;
document.getElementById('pv').onclick=prev;
document.getElementById('ov').onclick=toggleGrid;

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if(lightbox.classList.contains('show')){
    if(['Escape','ArrowRight','ArrowLeft',' ','PageDown','PageUp'].includes(e.key)){
      e.preventDefault(); lightbox.classList.remove('show');
    }
    return;
  }
  switch(e.key){
    case 'ArrowRight': case 'PageDown': case ' ': e.preventDefault(); grid.classList.contains('show')||next(); break;
    case 'ArrowLeft': case 'PageUp': e.preventDefault(); grid.classList.contains('show')||prev(); break;
    case 'Home': e.preventDefault(); show(0); break;
    case 'End': e.preventDefault(); show(SLIDES.length-1); break;
    case 'o': case 'O': toggleGrid(); break;
    case 'Escape': closeGrid(); break;
    case 'f': case 'F': if(!document.fullscreenElement) document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); else document.exitFullscreen&&document.exitFullscreen(); break;
  }
});
// ハッシュは2形式を受け付ける: 通し番号 #42（従来）と章キー #s4（flow.html の見出し id）。
// 章キーはスライドを増減しても指す先が変わらないので、flow.html からのリンクはこちらを使う。
function indexFromHash(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(!h) return -1;
  const n=parseInt(h,10);
  if(String(n)===h) return (n>=1&&n<=SLIDES.length)?n-1:-1;
  return REF_FIRST[h]!==undefined?REF_FIRST[h]:-1;
}
window.addEventListener('hashchange',()=>{ const i=indexFromHash(); if(i>=0&&i!==cur) show(i,false); });

// init from hash
const startIdx=indexFromHash();
show(startIdx>=0?startIdx:0,false);
</script>
</body></html>
