<svg width="100%" viewBox="0 0 780 344" role="img" xmlns="http://www.w3.org/2000/svg">
  <title style="fill:rgb(0,0,0)">ワークショップフロー図</title>
  <desc style="fill:rgb(0,0,0)">Core（全員必達）7ステージとOption（選択式）7テーマのフローチャート</desc>
  <defs>
