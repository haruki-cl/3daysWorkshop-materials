    </marker>
  </defs>

  <!-- Core area -->
  <rect x="30" y="18" width="720" height="108" rx="14" fill="none" stroke="rgba(31,30,29,0.3)" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="50" y="38" style="font-size:12px;font-weight:500;fill:rgb(61,61,58);font-family:-apple-system,system-ui,sans-serif">Core — Section 1〜2・全員必達</text>

  <!-- [1] デザイン: x=42, center=84 -->
  <g>
